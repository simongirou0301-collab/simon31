<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Carnet Push Pull</title>
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carnet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="run.css">

<style>
:root{
  --bg:#eef0f2; --surface:#ffffff; --ink:#1b2129; --muted:#5d6874; --line:#d6dbe0;
  --plate:#c8372d; --plate-soft:#f6dedb; --done:#2f7a4f; --scrim:rgba(10,12,15,.88);
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Archivo",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#13171c; --surface:#1d232a; --ink:#e8ecf0; --muted:#97a3ae; --line:#2e3740;
  --plate:#ec5a4d; --plate-soft:#3a2120; --done:#5cc48a; --scrim:rgba(0,0,0,.9); color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body,button,input,label{touch-action:manipulation}
input{font-size:16px!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:18px}
header h1{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.01em}
header p{margin:6px 0 0;color:var(--muted);font-size:.85rem}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:2}
.tab{font-family:var(--display);font-weight:800;font-size:1.25rem;text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.tab small{font-family:var(--body);font-weight:500;font-size:.75rem;letter-spacing:0;text-transform:none;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--plate);box-shadow:inset 0 0 0 1px var(--plate)}
button:focus-visible,input:focus-visible,label:focus-within{outline:3px solid var(--plate);outline-offset:2px}
.progress{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted)}
.btn{font:600 .8rem var(--body);color:var(--muted);background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.list{display:flex;flex-direction:column;gap:12px;list-style:none;margin:0;padding:0}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:76px 1fr auto;gap:10px 12px;align-items:start}
.ex.complete{border-color:var(--done)}
.thumb{width:76px;height:76px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;padding:0;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.info{min-width:0}
.ex h2{font-family:var(--display);font-weight:600;font-size:1.3rem;line-height:1.1;margin:0;text-wrap:balance}
.scheme{font-family:var(--mono);font-size:.8rem;margin-top:4px}
.note{color:var(--muted);font-size:.8rem;margin-top:3px}
.load{text-align:right;min-width:78px;background:none;border:0;padding:4px;border-radius:8px;cursor:pointer;color:inherit}
.load .kg{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1;color:var(--plate);font-variant-numeric:tabular-nums}
.load .kg.empty{color:var(--muted)}
.load .unit{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;max-width:110px;margin-left:auto}
.load .edit{font-size:.68rem;color:var(--plate);margin-top:2px}
.editor{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:end;background:var(--bg);border-radius:10px;padding:10px}
.editor label{display:flex;flex-direction:column;gap:3px;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.editor input{font:600 1rem var(--mono);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;width:110px}
.editor input.wide{width:150px}
.save{font:600 .85rem var(--body);background:var(--plate);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
.foot{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sets{display:flex;gap:6px;flex-wrap:wrap}
.set{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--bg);color:var(--muted);font:600 .8rem var(--mono);cursor:pointer;display:grid;place-items:center}
.set[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:var(--surface)}
.feel{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.feel-q{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.feel-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.fb{font:600 .85rem var(--body);border-radius:8px;padding:8px 4px;cursor:pointer;border:1px solid var(--line);background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:1px}
.fb small{font-weight:500;font-size:.68rem;color:var(--muted)}
.fb:disabled{opacity:.45;cursor:not-allowed}
.fb[aria-pressed="true"]{border-color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--ink)}
.fb.f-easy[aria-pressed="true"]{border-color:var(--done);box-shadow:inset 0 0 0 1px var(--done)}
.fb.f-hard[aria-pressed="true"]{border-color:var(--plate);box-shadow:inset 0 0 0 1px var(--plate)}
.last{font-size:.75rem;color:var(--muted)}
.finish{font:800 1.15rem var(--display);text-transform:uppercase;letter-spacing:.04em;background:var(--plate);color:#fff;border:0;border-radius:10px;padding:14px;cursor:pointer;width:100%}
.finish-note{font-size:.8rem;color:var(--muted);text-align:center;margin:-8px 0 0}
.confirm{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--plate);border-radius:10px;padding:12px}
.confirm-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gym{display:flex;flex-direction:column;gap:18px}
.lightbox{position:fixed;inset:0;background:var(--scrim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:10}
.lightbox img{max-width:100%;max-height:72vh;border-radius:10px;object-fit:contain;background:#fff}
.lightbox p{color:#fff;font-family:var(--display);font-size:1.3rem;margin:0;text-align:center}
.lb-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.lb-actions button,.lb-actions label{font:600 .85rem var(--body);background:#fff;color:#1b2129;border:0;border-radius:8px;padding:9px 14px;cursor:pointer}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
footer{color:var(--muted);font-size:.78rem}
@media (max-width:420px){.ex{grid-template-columns:64px 1fr auto}.thumb{width:64px;height:64px}}
@media (prefers-reduced-motion:no-preference){.set,.ex{transition:background .15s,border-color .15s}}
</style>
<link rel="stylesheet" href="apple.css">
</head>
<body>
<div class="wrap">
  <header class="large">
    <p class="eyebrow" id="today"></p>
    <h1 id="ttl">Push</h1>
    <p class="sub" id="sub">Lundi · Jeudi</p>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-s="today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span>Aujourd'hui</span></button>
    <button class="tab" role="tab" data-s="push"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span>Push</span></button>
    <button class="tab" role="tab" data-s="pull"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11M7 9l5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Pull</span></button>
    <button class="tab" role="tab" data-s="run"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="14.5" cy="4.5" r="2" fill="currentColor"/><path d="M8 21l3-5 3 2v4M6 12l3-4 4 1 2 3 3 1M11 16l2-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Course</span></button>
  </nav>

  <section id="run-view" hidden></section>
  <section id="today-view" hidden></section>

  <div id="gym-view" class="gym">
  <div class="wg" id="gsum"></div>
  <div class="progress"><span id="count" hidden></span><button class="btn" id="reset" type="button">Remettre les séries à zéro</button></div>

  <ul class="list" id="list"></ul>
  <div id="prog" hidden></div>

  <button class="finish" type="button" id="finish">Terminer la séance</button>
  <div class="confirm" id="confirm" hidden>
    <div id="confirm-txt"></div>
    <div class="confirm-row"><button class="save" type="button" id="confirm-yes">Valider</button><button class="btn" type="button" id="confirm-no">Retour</button></div>
  </div>
  <p class="finish-note" id="finish-note"></p>
  <button class="btn jr-btn" type="button" id="jr-btn">Journal, courbes et calendrier</button>
  <div class="journal" id="journal" hidden></div>
  <div class="backup" id="backup">
    <button class="btn pg-open" type="button" id="pg-open">Modifier le programme</button>
    <button class="btn" type="button" id="bk-out">Sauvegarder mes données</button>
    <label class="btn">Restaurer<input class="vh" type="file" accept=".json,application/json" id="bk-in"></label>
    <p class="muted" id="bk-msg"></p>
  </div>
  </div>

  <footer id="gym-foot">Les poids sont le total sur la machine ou la barre, sauf mention « / côté » ou « / haltère ». Tes données restent sur ce téléphone.</footer>
</div>

<div class="timer" id="timer" hidden role="timer" aria-live="polite">
  <svg class="t-ring" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="19" class="t-bg"/><circle cx="22" cy="22" r="19" class="t-fg" id="t-fg"/></svg>
  <div class="t-main"><div class="t-time" id="t-time">0:00</div><div class="t-lbl" id="t-lbl">Repos</div></div>
  <button type="button" class="t-btn" id="t-minus" aria-label="Retirer 15 secondes">−15</button>
  <button type="button" class="t-btn" id="t-plus" aria-label="Ajouter 15 secondes">+15</button>
  <button type="button" class="t-btn t-skip" id="t-skip" aria-label="Arrêter le minuteur">✕</button>
</div>

<div class="lightbox" id="lb" hidden>
  <img id="lb-img" alt="">
  <p id="lb-title"></p>
  <div class="lb-actions">
    <label>Changer la photo<input class="vh" type="file" accept="image/*" id="lb-file"></label>
    <button type="button" id="lb-default" hidden>Photo d'origine</button>
    <button type="button" id="lb-close">Fermer</button>
  </div>
</div>

<script>
const EX = {
  push: [
    {id:"push-1", rest:150, n:"Développé couché à la Smith", s:3, r:"6-8 · échec", note:"Incliné ou plat · monte le poids progressivement"},
    {id:"push-2", rest:90, n:"Pec fly à la machine", s:3, r:"10", note:"Pleine amplitude"},
    {id:"push-3", rest:120, n:"Chest press prise serrée", s:3, r:"10-12 · échec", note:"Prise serrée, à plat"},
    {id:"push-6", rest:150, n:"Développé militaire à la Smith, assis", s:4, r:"8 · échec", note:"3 à 4 séries"},
    {id:"push-4", rest:75, n:"Élévation latérale unilatérale à la poulie", s:3, r:"12", note:"Charge modérée, bonne amplitude"},
    {id:"push-5", rest:90, n:"Élévation latérale aux haltères", s:3, r:"6-8 · échec", note:"Lourd, sans balancer le buste"},
    {id:"push-7", rest:90, n:"Extension triceps poulie haute, barre", s:3, r:"10-12 · échec", note:"Coudes collés aux côtes"},
    {id:"push-8", rest:75, n:"Extension triceps unilatérale à la poulie", s:3, r:"10-12 · échec", note:"Bras calé contre la barre"}
  ],
  pull: [
    {id:"pull-1", rest:150, n:"Tirage vertical, barre en V", s:3, r:"8 · échec", note:"2 min 30 de repos · vers le haut de la poitrine"},
    {id:"pull-2", rest:120, n:"Tirage horizontal prise serrée", s:3, r:"8 lourdes + 12 légères", note:"Enchaîne les deux sans pause"},
    {id:"pull-3", rest:90, n:"Tirage horizontal prise large, poignée ergo", s:3, r:"12", note:"Prise neutre, serre les omoplates"},
    {id:"pull-4", rest:120, n:"Pec fly inversé (arrière d'épaule)", s:3, r:"10", note:"2 min de repos · ouvre les bras en T"},
    {id:"pull-5", rest:90, n:"Curl marteau à la poulie, corde", s:3, r:"8 lourdes + 12 légères", note:"Coudes contre les côtes"},
    {id:"pull-6", rest:90, n:"Curl supination aux haltères, assis", s:3, r:"8-10", note:"Dos collé au dossier"},
    {id:"pull-7", rest:75, n:"Curl inversé, barre droite", s:3, r:"10", note:"Prise pronation, coudes fixes"}
  ]
};
const DEFAULT_LOADS = {
  "push-1":{kg:"20",unit:"kg / côté"}, "push-2":{kg:"",unit:"conseillé 30-35 kg"}, "push-3":{kg:"40",unit:"kg"},
  "push-4":{kg:"",unit:"conseillé 5 kg"}, "push-5":{kg:"",unit:"conseillé 8-10 kg / haltère"}, "push-6":{kg:"10",unit:"kg / côté"},
  "push-7":{kg:"30",unit:"kg"}, "push-8":{kg:"",unit:"conseillé 7-10 kg"},
  "pull-1":{kg:"60",unit:"kg"}, "pull-2":{kg:"40 / 25",unit:"kg (lourd / léger)"}, "pull-3":{kg:"",unit:"conseillé 30 kg"},
  "pull-4":{kg:"",unit:"conseillé 15-20 kg"}, "pull-5":{kg:"35 / 20",unit:"kg (lourd / léger)"},
  "pull-6":{kg:"",unit:"conseillé 10-12 kg / haltère"}, "pull-7":{kg:"15",unit:"kg"}
};
const DEF = JSON.parse(JSON.stringify(EX));
const DEFALL = [...DEF.push, ...DEF.pull];
let ALL = [...DEFALL];
const byId = id => ALL.find(e => e.id === id) || (st.custom && st.custom[id]) || {id, n:"Exercice supprimé", r:"8", s:3, rest:90, note:""};

/* ---------- stockage local ---------- */
const KEY = "carnet-pp-app-v1";
let st = {tab:null, done:{}, feel:{}, loads:null, reps:{}, log:[], prog:{}, ovr:{}, custom:{}, weights:[]};
try { const v = JSON.parse(localStorage.getItem(KEY)); if (v) st = Object.assign(st, v); } catch (e) {}
if (!st.loads) st.loads = JSON.parse(JSON.stringify(DEFAULT_LOADS));
for (const k in DEFAULT_LOADS) if (!st.loads[k]) st.loads[k] = {...DEFAULT_LOADS[k]};
st.tab = "today";
function applyProg(){
  const mk = id => { const b = DEFALL.find(e => e.id === id) || st.custom[id]; return b ? {...b, ...(st.ovr[id] || {})} : null; };
  ["push", "pull"].forEach(t => { EX[t] = (st.prog[t] || DEF[t].map(e => e.id)).map(mk).filter(Boolean); });
  const seen = new Set(); ALL = [];
  [...DEFALL, ...Object.values(st.custom)].forEach(e => { if (!seen.has(e.id)) { seen.add(e.id); ALL.push(mk(e.id)); } });
}
applyProg();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
save();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* photos perso dans IndexedDB */
const photoUrls = {};
let idb = null;
function openIdb(){
  return new Promise(res => {
    try {
      const r = indexedDB.open("carnet-photos", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("photos");
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
    } catch (e) { res(null); }
  });
}
function idbDo(mode, fn){
  return new Promise(res => {
    if (!idb) return res(null);
    try { const tx = idb.transaction("photos", mode); const r = fn(tx.objectStore("photos")); tx.oncomplete = () => res(r && r.result); tx.onerror = () => res(null); }
    catch (e) { res(null); }
  });
}
async function loadCustomPhotos(){
  idb = await openIdb(); if (!idb) return;
  for (const e of ALL) {
    const blob = await idbDo("readonly", s => s.get(e.id));
    if (blob) photoUrls[e.id] = URL.createObjectURL(blob);
  }
  render();
}
const PH = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#e5e5ea"/><path d="M22 40v20M30 32v36M70 32v36M78 40v20M30 50h40" stroke="#8e8e93" stroke-width="6" stroke-linecap="round" fill="none"/></svg>');
const photoOf = id => photoUrls[id] || (st.custom[id] ? PH : `photos/${id}.jpg`);

/* ---------- rendu ---------- */
let editing = null;
const list = document.getElementById("list");
function esc(s){ return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const canAdj = L => !!(L && L.kg && /\d/.test(L.kg));

function render(){
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.s === st.tab));
  const isRun = st.tab === "run", isToday = st.tab === "today";
  document.body.dataset.tab = st.tab;
  const T = {push:["Push","Lundi · Jeudi"], pull:["Pull","Mardi · Vendredi"], run:["Course","Garmin · Intervals.icu"], today:["Aujourd'hui","Ton résumé"]}[st.tab];
  document.getElementById("ttl").textContent = T[0]; document.getElementById("sub").textContent = T[1];
  const td = new Date().toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"long"});
  document.getElementById("today").textContent = td;
  document.getElementById("gym-view").hidden = isRun || isToday;
  document.getElementById("gym-foot").hidden = isRun || isToday;
  document.getElementById("run-view").hidden = !isRun;
  document.getElementById("today-view").hidden = !isToday;
  if (isToday) { renderToday(); return; }
  if (isRun) { if (window.Run) Run.show(); return; }
  let tot = 0, ok = 0; list.innerHTML = "";
  EX[st.tab].forEach(e => {
    const L = st.loads[e.id] || {}; const d = st.done[e.id] || [];
    const nd = d.filter(Boolean).length; tot += e.s; ok += nd;
    const li = document.createElement("li");
    li.className = "ex" + (nd === e.s ? " complete" : "");
    const kg = L.kg
      ? `<div class="kg">${esc(L.kg)}</div><div class="unit">${esc(L.unit || "kg")}</div>`
      : `<div class="kg empty">—</div><div class="unit">${esc(L.unit || "à définir")}</div>`;
    let sets = ""; for (let k = 0; k < e.s; k++) sets += `<button class="set" type="button" aria-pressed="${!!d[k]}" aria-label="Série ${k+1}" data-id="${e.id}" data-k="${k}">${k+1}</button>`;
    const f = st.feel[e.id];
    const rp = st.reps[e.id] || [];
    let repsRow = ""; if (nd) { repsRow = `<div class="reps"><span>Reps</span>`; for (let k = 0; k < e.s; k++) if (d[k]) repsRow += `<input type="number" inputmode="numeric" min="0" max="99" value="${rp[k] ?? ""}" aria-label="Reps série ${k+1}" data-rid="${e.id}" data-rk="${k}">`; repsRow += `</div>`; }
    const ed = editing === e.id ? `<form class="editor" data-form="${e.id}">
        <label>Charge<input id="kg-${e.id}" name="kg" value="${esc(L.kg || "")}" inputmode="decimal" autocomplete="off"></label>
        <label>Unité / précision<input class="wide" id="unit-${e.id}" name="unit" value="${esc(L.kg ? (L.unit || "kg") : "kg")}" autocomplete="off"></label>
        <button class="save" type="submit">Enregistrer</button>
        <button class="btn" type="button" data-cancel>Annuler</button></form>` : "";
    li.innerHTML = `<button class="thumb" type="button" data-photo="${e.id}" aria-label="Agrandir la photo"><img src="${photoOf(e.id)}" alt="${esc(e.n)}" loading="lazy"></button>
      <div class="info"><h2>${esc(e.n)}</h2><div class="scheme">${e.s} × ${esc(e.r)} <span class="rest">· repos ${Math.floor((e.rest||90)/60)}:${String((e.rest||90)%60).padStart(2,"0")}</span></div><div class="note">${esc(e.note)}</div></div>
      <button class="load" type="button" data-edit="${e.id}">${kg}</button>
      ${ed}
      <div class="foot"><div class="sets">${sets}</div>${repsRow}</div>
      <div class="feel">
        <div class="feel-q">Comment se sont passées tes séries ?</div>
        <div class="feel-btns">

  const gym = new Set(), run = new Set();
  st.log.forEach(s => gym.add(dk(new Date(s.t))));
  try { (JSON.parse(localStorage.getItem("carnet-runs-icu-v1")).list || []).forEach(r => run.add(dk(new Date(r.start.replace("Z", ""))))); } catch (e) {}
  return {gym, run};
}
function streakWeeks(){
  const {gym, run} = calData(), any = new Set([...gym, ...run]); const mon = d => new Date(d.getFullYear(), d.getMonth(), d.getDate() - (d.getDay() + 6) % 7);
  const weekHas = ws => { for (let i = 0; i < 7; i++) if (any.has(dk(new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() + i)))) return true; return false; };
  let ws = mon(new Date()), n = 0; if (!weekHas(ws)) ws = new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() - 7);
  while (weekHas(ws) && n < 520) { n++; ws = new Date(ws.getFullYear(), ws.getMonth(), ws.getDate() - 7); }
  return n;
}
function calHtml(){
  const {gym, run} = calData(), y = calM.getFullYear(), m = calM.getMonth();
  const first = (new Date(y, m, 1).getDay() + 6) % 7, nd = new Date(y, m + 1, 0).getDate(), today = dk(new Date());
  let cells = ["L","M","M","J","V","S","D"].map(x => `<div class="cal-w">${x}</div>`).join("") + '<div></div>'.repeat(first);
  let g = 0, r = 0;
  for (let d = 1; d <= nd; d++) {
    const k = dk(new Date(y, m, d)), a = gym.has(k), b = run.has(k); if (a) g++; if (b) r++;
    cells += `<div class="cal-d${k === today ? " today" : ""}"><span>${d}</span><i>${a ? '<u class="g"></u>' : ""}${b ? '<u class="r"></u>' : ""}</i></div>`;
  }
  const streak = streakWeeks();
  const title = calM.toLocaleDateString("fr-FR", {month: "long", year: "numeric"});
  return `<div class="jr-s"><div class="cal-h"><button type="button" data-cal="-1" aria-label="Mois précédent">‹</button><b>${title}</b><button type="button" data-cal="1" aria-label="Mois suivant">›</button></div>
    <div class="cal-g">${cells}</div>
    <div class="cal-leg"><span><u class="g"></u> Muscu · ${g}</span><span><u class="r"></u> Course · ${r}</span></div></div>
    <div class="jr-s"><div class="cal-streak"><b>${streak}</b><span>semaine${streak > 1 ? "s" : ""} d'affilée avec au moins une séance</span></div></div>`;
}
function renderJournal(){
  const seg = `<div class="jr-seg"><button type="button" data-jv="seances" aria-selected="${jrView === "seances"}">Séances</button><button type="button" data-jv="courbes" aria-selected="${jrView === "courbes"}">Courbes</button><button type="button" data-jv="cal" aria-selected="${jrView === "cal"}">Calendrier</button></div>`;
  let body = "";
  if (jrView === "seances") {
    const L = st.log.slice().reverse();
    body = L.length ? L.map(s => {
      const d = new Date(s.t).toLocaleDateString("fr-FR", {weekday:"short", day:"numeric", month:"short"});
      const sets = s.ex.reduce((a, x) => a + x.reps.length, 0);
      return `<div class="jr-s"><div class="jr-h"><b>${s.tab === "push" ? "Push" : "Pull"}</b><span>${d} · ${sets} séries${s.vol ? " · " + nf(s.vol) + " kg" : ""}</span></div>` +
        s.ex.map(x => `<div class="jr-e"><span class="n">${esc(byId(x.id).n)}</span><span class="v">${esc(x.kg || "—")} · ${x.reps.join("/")}</span></div>`).join("") + `</div>`;
    }).join("") : `<p class="muted">Aucune séance enregistrée pour l'instant.</p>`;
  } else if (jrView === "cal") {
    body = calHtml();
  } else {
    const out = [];
    ALL.forEach(e => {
      const pts = [];
      st.log.forEach(s => s.ex.forEach(x => { if (x.id === e.id && kgNum(x.kg) != null) pts.push({y: kgNum(x.kg), l: new Date(s.t).toLocaleDateString("fr-FR", {day:"numeric", month:"short"}), reps: x.reps}); }));
      if (!pts.length) return;
      const rec = Math.max(...pts.map(p => p.y));
      const first = pts[0].y, last = pts[pts.length - 1].y, dlt = last - first;
      const maxReps = Math.max(...pts.filter(p => p.y === rec).flatMap(p => p.reps));
      out.push(`<div class="jr-s"><div class="jr-h"><b>${esc(e.n)}</b><span>${pts.length} séance${pts.length > 1 ? "s" : ""}</span></div>${curve(pts)}` +
        `<div class="jr-rec"><span>Record <b>${fmt(rec)}</b> × ${maxReps}</span>${pts.length > 1 ? `<span class="${dlt >= 0 ? "up" : "down"}">${dlt >= 0 ? "+" : ""}${fmt(dlt)} depuis le début</span>` : ""}</div></div>`);
    });
    body = out.length ? out.join("") : `<p class="muted">Les courbes apparaîtront après ta première séance terminée.</p>`;
  }
  jr.innerHTML = seg + body;
}
jr.addEventListener("click", ev => {
  const c = ev.target.closest("[data-cal]"); if (c) { calM = new Date(calM.getFullYear(), calM.getMonth() + +c.dataset.cal, 1); renderJournal(); return; } const b = ev.target.closest("[data-jv]"); if (b) { jrView = b.dataset.jv; renderJournal(); } });
document.getElementById("jr-btn").addEventListener("click", () => { jr.hidden = !jr.hidden; if (!jr.hidden) renderJournal(); });

/* ---------- programme ---------- */
let progEdit = false, pEdit = null;
const progEl = document.getElementById("prog"), gymEl = document.getElementById("gym-view");
const mmss = x => Math.floor(x / 60) + ":" + String(x % 60).padStart(2, "0");
function renderProg(){
  const ids = EX[st.tab];
  const form = e => `<form class="pg-f" data-pgf="${e ? e.id : "new"}">
    <label>Nom<input name="n" value="${esc(e ? e.n : "")}" required autocomplete="off"></label>
    <div class="pg-g"><label>Séries<input name="s" type="number" inputmode="numeric" min="1" max="10" value="${e ? e.s : 3}"></label>
    <label>Reps<input name="r" value="${esc(e ? e.r : "10")}" autocomplete="off"></label>
    <label>Repos (s)<input name="rest" type="number" inputmode="numeric" min="0" max="600" step="15" value="${e ? (e.rest || 90) : 90}"></label></div>
    <div class="pg-g2"><button class="save" type="submit">Enregistrer</button><button class="btn" type="button" data-pg="cancel">Annuler</button></div></form>`;
  progEl.innerHTML = `<div class="pg-h"><b>Programme ${st.tab === "push" ? "Push" : "Pull"}</b><button class="btn" type="button" data-pg="done">Terminé</button></div>` +
    ids.map((e, i) => pEdit === e.id ? form(e) : `<div class="pg-r"><div class="pg-t"><b>${esc(e.n)}</b><span>${e.s} × ${esc(e.r)} · repos ${mmss(e.rest || 90)}</span></div>
      <div class="pg-b"><button type="button" data-pg="up" data-i="${i}" ${i ? "" : "disabled"} aria-label="Monter">↑</button><button type="button" data-pg="down" data-i="${i}" ${i < ids.length - 1 ? "" : "disabled"} aria-label="Descendre">↓</button><button type="button" data-pg="edit" data-id="${e.id}" aria-label="Modifier">✎</button><button type="button" data-pg="del" data-id="${e.id}" aria-label="Supprimer">✕</button></div></div>`).join("") +
    (pEdit === "new" ? form(null) : `<button class="btn pg-add" type="button" data-pg="add">+ Ajouter un exercice</button>`) +
    `<button class="btn pg-rst" type="button" data-pg="reset">Rétablir le programme d'origine</button>`;
}
function setProg(ids){ st.prog[st.tab] = ids; save(); applyProg(); renderProg(); }
document.getElementById("pg-open").addEventListener("click", () => { progEdit = true; pEdit = null; gymEl.classList.add("pe"); progEl.hidden = false; renderProg(); window.scrollTo(0, 0); });
progEl.addEventListener("click", ev => {
  const b = ev.target.closest("[data-pg]"); if (!b) return;
  const ids = EX[st.tab].map(e => e.id), a = b.dataset.pg, i = +b.dataset.i;
  if (a === "done") { progEdit = false; pEdit = null; gymEl.classList.remove("pe"); progEl.hidden = true; render(); }
  else if (a === "up" || a === "down") { const j = a === "up" ? i - 1 : i + 1; [ids[i], ids[j]] = [ids[j], ids[i]]; setProg(ids); }
  else if (a === "edit") { pEdit = b.dataset.id; renderProg(); }
  else if (a === "add") { pEdit = "new"; renderProg(); }
  else if (a === "cancel") { pEdit = null; renderProg(); }
  else if (a === "del") { if (confirm("Retirer cet exercice du programme ? Ton historique est conservé.")) setProg(ids.filter(x => x !== b.dataset.id)); }
  else if (a === "reset") { if (confirm("Revenir au programme d'origine ?")) { st.prog = {}; st.ovr = {}; pEdit = null; save(); applyProg(); renderProg(); } }
});
progEl.addEventListener("submit", ev => {
  ev.preventDefault(); const f = ev.target, id = f.dataset.pgf;
  const v = {n: f.n.value.trim(), s: Math.max(1, Math.min(10, parseInt(f.s.value, 10) || 3)), r: f.r.value.trim() || "10", rest: Math.max(0, parseInt(f.rest.value, 10) || 90)};
  if (!v.n) return;
  if (id === "new") {
    const nid = "c-" + Date.now().toString(36);
    st.custom[nid] = {id: nid, note: "", ...v}; st.loads[nid] = {kg: "", unit: "kg"};
    pEdit = null; setProg([...EX[st.tab].map(e => e.id), nid]);
  } else { st.ovr[id] = v; pEdit = null; save(); applyProg(); renderProg(); }
});

/* ---------- sauvegarde ---------- */
const b64 = blob => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(blob); });
const bkMsg = t => document.getElementById("bk-msg").textContent = t;
document.getElementById("bk-out").addEventListener("click", async () => {
  try {
    const photos = {};
    for (const e of ALL) { const bl = await idbDo("readonly", x => x.get(e.id)); if (bl) photos[e.id] = await b64(bl); }
    const data = JSON.stringify({app: "carnet-pp", v: 1, date: new Date().toISOString(), state: st, photos});
    const name = "carnet-sauvegarde-" + new Date().toISOString().slice(0, 10) + ".json";
    const file = new File([data], name, {type: "application/json"});
    if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: name}); }
    else { const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
    bkMsg("Sauvegarde prête. Garde le fichier dans Fichiers ou iCloud.");
  } catch (e) { if (e && e.name !== "AbortError") bkMsg("Échec de la sauvegarde."); }
});
document.getElementById("bk-in").addEventListener("change", async ev => {
  const f = ev.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (d.app !== "carnet-pp" || !d.state) throw 0;
    if (!confirm("Remplacer tes données actuelles par cette sauvegarde ?")) { ev.target.value = ""; return; }
    for (const id in (d.photos || {})) { const bl = await (await fetch(d.photos[id])).blob(); await idbDo("readwrite", x => x.put(bl, id)); }
    localStorage.setItem(KEY, JSON.stringify(d.state));
    location.reload();
  } catch (e) { bkMsg("Fichier invalide."); ev.target.value = ""; }
});

/* ---------- photos ---------- */
const lb = document.getElementById("lb"); let lbId = null;
function openLb(id){
  lbId = id;
  const img = document.getElementById("lb-img"); img.src = photoOf(id); img.alt = byId(id).n;
  document.getElementById("lb-title").textContent = byId(id).n;
  document.getElementById("lb-default").hidden = !photoUrls[id];
  lb.hidden = false;
}
const closeLb = () => { lb.hidden = true; lbId = null; };
document.getElementById("lb-close").addEventListener("click", closeLb);
lb.addEventListener("click", ev => { if (ev.target === lb) closeLb(); });
document.getElementById("lb-file").addEventListener("change", async ev => {
  const file = ev.target.files[0]; ev.target.value = ""; if (!file || !lbId) return;
  await idbDo("readwrite", s => s.put(file, lbId));
  if (photoUrls[lbId]) URL.revokeObjectURL(photoUrls[lbId]);
  photoUrls[lbId] = URL.createObjectURL(file);
  openLb(lbId); render();
});
document.getElementById("lb-default").addEventListener("click", async () => {
  if (!lbId) return;
  await idbDo("readwrite", s => s.delete(lbId));
  if (photoUrls[lbId]) URL.revokeObjectURL(photoUrls[lbId]);
  delete photoUrls[lbId];
  openLb(lbId); render();
});


/* ---------- minuteur de repos ---------- */
const tEl = document.getElementById("timer"), tTime = document.getElementById("t-time"), tLbl = document.getElementById("t-lbl"), tFg = document.getElementById("t-fg");
const RING = 2 * Math.PI * 19; tFg.style.strokeDasharray = RING;
let actx = null, tTick = null;
function unlockAudio(){ try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch(e){} }
function beep(){
  try {
    unlockAudio(); if (!actx) return;
    [0, .28, .56].forEach((t, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = i === 2 ? 1320 : 880;
      g.gain.setValueAtTime(0.0001, actx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.4, actx.currentTime + t + .02); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + t + .22);
      o.connect(g); g.connect(actx.destination); o.start(actx.currentTime + t); o.stop(actx.currentTime + t + .25);
    });
  } catch(e){}
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch(e){}
}
function startTimer(id, k){
  unlockAudio();
  const e = byId(id), dur = e.rest || 90;
  st.timer = {end: Date.now() + dur * 1000, dur, id, k, rang: false};
  save(); runTimer();
}
function runTimer(){
  clearInterval(tTick);
  if (!st.timer) { tEl.hidden = true; return; }
  tEl.hidden = false; tick(); tTick = setInterval(tick, 250);
}
function tick(){
  const t = st.timer; if (!t) return runTimer();
  const left = Math.ceil((t.end - Date.now()) / 1000);
  const e = byId(t.id);
  if (left <= 0) {
    tEl.classList.add("over");
    tTime.textContent = "Go !";
    tLbl.textContent = `Série ${t.k + 2 <= e.s ? t.k + 2 : t.k + 1} · ${e.n}`;
    tFg.style.strokeDashoffset = 0;
    if (!t.rang) { t.rang = true; save(); beep(); }
    if (left < -60) { st.timer = null; save(); tEl.classList.remove("over"); runTimer(); }
    return;
  }
  tEl.classList.remove("over");
  tTime.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
  tLbl.textContent = `Repos · ${e.n}`;
  tFg.style.strokeDashoffset = RING * (1 - left / t.dur);
}
document.getElementById("t-plus").addEventListener("click", () => { if (!st.timer) return; st.timer.end += 15000; st.timer.dur += 15; st.timer.rang = false; save(); tick(); });
document.getElementById("t-minus").addEventListener("click", () => { if (!st.timer) return; st.timer.end -= 15000; st.timer.dur = Math.max(15, st.timer.dur - 15); save(); tick(); });
document.getElementById("t-skip").addEventListener("click", () => { st.timer = null; save(); tEl.classList.remove("over"); runTimer(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden && st.timer) tick(); });
runTimer();

/* bloque le zoom par pincement (le double-tap est bloqué en CSS) */
["gesturestart","gesturechange","gestureend"].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive:false}));
document.addEventListener("touchmove", e => { if (e.scale !== undefined && e.scale !== 1) e.preventDefault(); }, {passive:false});

render();
loadCustomPhotos();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
