<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mon PEA au quotidien</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mon PEA">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
/* Layout : une colonne façon appli mobile ; résumé du jour, onglets ETF, carte des entreprises, barres d'impact, fil des explications. */
:root{
  --bg:#F3F5F9; --card:#FFFFFF; --ink:#101A2E; --muted:#5B6680; --line:#E2E6EF;
  --accent:#3B5BFF; --accent-soft:#E7ECFF;
  --c-global:#3B5BFF; --c-nasdaq:#8B4FE0; --c-europe:#D9900F;
  --up:#0B9A6A; --up-soft:#DDF4EA; --down:#DC3B48; --down-soft:#FBE3E5; --flat:#A6AEC0;
  --f-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1120; --card:#141C2E; --ink:#E8ECF6; --muted:#9AA5BD; --line:#24304A;
  --accent:#7C93FF; --accent-soft:#1E2950;
  --c-global:#7C93FF; --c-nasdaq:#B58CFF; --c-europe:#F2B544;
  --up:#33C98E; --up-soft:#11352A; --down:#FF6B76; --down-soft:#3E1A22; --flat:#5D6782; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1120; --card:#141C2E; --ink:#E8ECF6; --muted:#9AA5BD; --line:#24304A;
  --accent:#7C93FF; --accent-soft:#1E2950;
  --c-global:#7C93FF; --c-nasdaq:#B58CFF; --c-europe:#F2B544;
  --up:#33C98E; --up-soft:#11352A; --down:#FF6B76; --down-soft:#3E1A22; --flat:#5D6782; color-scheme:dark}
*{box-sizing:border-box}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
input,select,textarea{font-size:16px!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-weight:700;font-size:.85rem}
.pill.up{background:var(--up-soft)} .pill.down{background:var(--down-soft)} .pill.flat{background:var(--line)}

header{display:flex;flex-direction:column;gap:6px}
.hero{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:end}
.hero .big{font-size:2.3rem;font-weight:700;line-height:1}
.resume{margin:0;max-width:62ch}

.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:5px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tab{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:600;padding:9px 6px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.tab .num{font-size:.78rem}
.tab[aria-selected="true"]{background:var(--accent);color:#fff}
.tab[aria-selected="true"] .num{color:#fff}
.tab:focus-visible,button:focus-visible,.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.etfhead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.kpi{background:var(--bg);border-radius:12px;padding:10px}
.kpi .v{font-size:1.15rem;font-weight:700}
.kpi label{display:block;font-size:.75rem;color:var(--muted)}
.kpi input{width:100%;font:inherit;font-family:var(--f-num);font-size:1.05rem;font-weight:700;color:var(--ink);background:transparent;border:0;border-bottom:1px dashed var(--muted);padding:0}
.chart{width:100%;height:auto;display:block;margin-top:12px}

.treemap{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;margin-top:10px;border-radius:12px;overflow:hidden}
.tile{position:absolute;border:2px solid var(--card);border-radius:8px;padding:5px 6px;overflow:hidden;cursor:pointer;color:#fff;display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s}
.tile:hover{transform:scale(1.02);z-index:2}
.tile b{font-family:var(--f-display);font-size:.85rem;line-height:1.1}
.tile .num{font-size:.75rem;font-weight:700}
.tile.sm b{font-size:.68rem}.tile.sm .num{font-size:.62rem}
.tile.xs b,.tile.xs .num{display:none}
.legend{display:flex;gap:6px;align-items:center;font-size:.75rem;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:18px;height:10px;border-radius:3px}

.detail{margin-top:12px;background:var(--bg);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.detail .row{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline}

.bars{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.bar{display:grid;grid-template-columns:96px 1fr 72px;gap:8px;align-items:center;font-size:.85rem;cursor:pointer;border:0;background:none;color:var(--ink);font-family:inherit;text-align:left;padding:2px 0}
.bar .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.track{position:relative;height:14px}
.track::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;border-left:1px solid var(--line)}
.fill{position:absolute;top:0;height:100%;border-radius:4px}
.bar .num{text-align:right;font-size:.8rem}

.news{display:flex;flex-direction:column;gap:10px}
.newsitem{border-left:4px solid var(--flat);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:4px}
.newsitem.up{border-color:var(--up)} .newsitem.down{border-color:var(--down)}
.newsitem p{margin:0;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-family:var(--f-num);font-size:.72rem;padding:1px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:700}

.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.day{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 10px;font:inherit;font-size:.82rem;cursor:pointer}
.day[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}

.word{background:var(--accent-soft);border:0}
.word h3{color:var(--accent)}
.word p{margin:4px 0 0}
details summary{cursor:pointer;font-weight:600}
.foot{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.empty{padding:40px 16px;text-align:center}

.views{display:flex;gap:4px;background:var(--line);border-radius:12px;padding:4px;align-self:flex-start;margin-top:4px}
.viewbtn{border:0;background:transparent;color:var(--ink);font:inherit;font-weight:600;font-size:.9rem;padding:6px 14px;border-radius:9px;cursor:pointer}
.viewbtn[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.note{background:var(--accent-soft);border:0}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:var(--muted);background:var(--bg);border-radius:10px;padding:8px 10px}
.form input{font:inherit;font-family:var(--f-num);font-size:1rem;font-weight:700;color:var(--ink);background:transparent;border:0;border-bottom:1px dashed var(--muted);padding:0;width:100%}
.btn{border:0;background:var(--accent);color:#fff;font:inherit;font-weight:600;padding:9px 14px;border-radius:10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.empty-inline{margin:12px 0 0;padding:16px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
.seg{display:flex;gap:4px}
.segbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:.82rem;padding:5px 10px;border-radius:9px;cursor:pointer}
.segbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.slider{margin-top:12px;display:flex;flex-direction:column;gap:4px}
.slider input{width:100%;accent-color:var(--accent)}
.jalons{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:10px}
.jalons div{display:flex;flex-direction:column;background:var(--bg);border-radius:10px;padding:8px 10px}
.expo,.cmp{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.exporow,.cmprow{display:grid;grid-template-columns:120px 1fr 74px;gap:8px;align-items:center;font-size:.85rem}
.exporow .name,.cmprow .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exporow .num,.cmprow .num{text-align:right;font-size:.8rem}
.stack{display:flex;height:14px;border-radius:4px;overflow:hidden}
.stack span{display:block;height:100%}
.badge{font-family:var(--f-num);font-size:.68rem;background:var(--down-soft);color:var(--down);border-radius:5px;padding:0 4px}
.track2{position:relative;height:14px;background:var(--bg);border-radius:4px}
.fill2{position:absolute;left:0;top:0;height:100%;background:var(--accent);border-radius:4px}
.ref{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px solid var(--ink)}
.refkey{display:inline-block;width:0;height:14px;border-left:2px solid var(--ink);margin-left:6px}
@media (max-width:480px){.exporow,.cmprow{grid-template-columns:92px 1fr 64px}}
.krach{background:var(--down-soft);border-color:var(--down)}
.krach h2{color:var(--down)}
.calm{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.tablewrap{overflow-x:auto;margin-top:12px}
.krachs{border-collapse:collapse;width:100%;font-size:.85rem;min-width:420px}
.krachs th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:4px 8px 6px 0;border-bottom:1px solid var(--line)}
.krachs td{padding:7px 8px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.cal{display:flex;flex-direction:column;margin-top:8px}
.calrow{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.calrow:last-child{border-bottom:0}
.caldate{display:flex;flex-direction:column;font-size:.85rem}
.chip.bank{background:var(--down-soft);color:var(--ink)}
.recaplist{margin:10px 0 8px;padding-left:20px;display:flex;flex-direction:column;gap:6px}
details summary h2{cursor:pointer}
.wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom, 0px))}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px max(8px, calc((100% - 760px) / 2)) calc(6px + env(safe-area-inset-bottom, 0px))}
.navbtn{border:0;background:transparent;color:var(--muted);font:inherit;font-size:.72rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;border-radius:10px;cursor:pointer;min-width:0}
.navbtn[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.subnav{display:flex;gap:4px;background:var(--line);border-radius:12px;padding:4px;overflow-x:auto}
.subbtn{flex:1;white-space:nowrap;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:600;font-size:.82rem;padding:7px 6px;border-radius:9px;cursor:pointer}
.subbtn[aria-pressed="true"]{background:var(--card);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.search{width:100%;margin-top:10px;font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.lex{margin:10px 0 0;display:flex;flex-direction:column}
.lexitem{padding:10px 0;border-bottom:1px solid var(--line)}
.lexitem.today dt{color:var(--accent)}
.lex dt{font-weight:700;font-family:var(--f-display)}
.lex dd{margin:2px 0 0}
.fichegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.fichegrid div{display:flex;flex-direction:column;background:var(--card);border-radius:10px;padding:8px 10px}
.fichegrid .tot{background:var(--accent-soft)}
.bigbar{position:relative;height:22px;border-radius:999px;background:var(--bg);overflow:hidden;margin-top:12px}
.bigbar span{position:absolute;left:0;top:0;bottom:0;background:var(--up);border-radius:999px}
.ticks{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-top:4px}
.cmptable{width:100%;border-collapse:collapse;margin-top:10px;font-size:.88rem}
.cmptable td{padding:8px 0;border-bottom:1px solid var(--line)}
.cmptable td:last-child{text-align:right;white-space:nowrap;padding-left:12px}
.navbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (max-width:480px){
  h1{font-size:1.55rem}.hero .big{font-size:1.9rem}
  .kpis{grid-template-columns:1fr 1fr}
  .kpis .kpi:first-child{grid-column:1/-1}
  .bar{grid-template-columns:78px 1fr 62px}
  .treemap{aspect-ratio:3/4}
}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
body{margin:0}
</style>

<body>
<div class="wrap" id="app">
  <header>
    <span class="eyebrow">Mon PEA · Trade Republic</span>
    <h1>Ce qui a fait bouger mon argent</h1>
  </header>
  <div class="card empty" id="loading">
    <h3>Chargement de la dernière séance…</h3>
    <p class="muted small">Les cours, les entreprises de chaque ETF et les explications du jour s'affichent ici dès qu'ils sont reçus.</p>
  </div>
</div>

<script>
const fmtPct = (v, d = 2) => v == null ? "n.d." : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d).replace(".", ",") + " %";
const fmtEur = (v, d = 2) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toLocaleString("fr-FR", {minimumFractionDigits: d, maximumFractionDigits: d}) + " €";
const fmtEurPlain = v => v.toLocaleString("fr-FR", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " €";
const cls = v => v == null ? "flat" : v > 0.05 ? "up" : v < -0.05 ? "down" : "flat";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

const WORDS = [
  ["ETF capitalisant", "Les dividendes versés par les entreprises ne te sont pas distribués : ils sont réinvestis dans l'ETF. C'est le cas de tes trois ETF (« Acc »)."],
  ["Pondération", "La part d'une entreprise dans l'ETF. Nvidia pèse environ 8 % du Nasdaq 100 : sur 100 € investis, environ 8 € sont « dans » Nvidia."],
  ["Contribution", "Pondération × variation. Une petite entreprise qui bondit de 10 % peut moins peser qu'un géant qui bouge de 1 %."],
  ["Indice", "Une liste d'entreprises calculée par un fournisseur (MSCI, Nasdaq). L'ETF se contente de la copier, d'où ses frais bas."],
  ["Effet de change", "Tes ETF sont en euros mais détiennent des actions en dollars. Si le dollar baisse face à l'euro, ton ETF baisse un peu même si les actions ne bougent pas."],
  ["Recommandation d'analyste", "Une banque (Goldman Sachs, BMO…) conseille d'acheter, garder ou vendre une action. Un relèvement fait souvent monter le cours le jour même."],
  ["Résultats trimestriels", "Tous les 3 mois, les entreprises publient chiffre d'affaires et bénéfices. C'est le moment où les cours bougent le plus."],
  ["Valorisation", "Le prix que le marché paie pour les bénéfices d'une entreprise. Quand elle est jugée « tendue », même une bonne nouvelle peut faire baisser l'action."],
  ["Investissement programmé", "Acheter le même montant chaque semaine lisse ton prix d'achat : tu achètes plus de parts quand c'est bas, moins quand c'est haut."],
  ["Concentration", "Dans le Nasdaq 100, les 10 premières entreprises pèsent près de la moitié de l'indice. Le MSCI Monde (ACWI) est beaucoup plus dispersé."],
  ["PEA", "Plan d'épargne en actions : une enveloppe fiscale française. Après 5 ans, tes gains ne paient plus l'impôt sur le revenu, seulement les prélèvements sociaux."],
  ["Plafond de versements", "Sur un PEA classique, tu peux verser au maximum 150 000 €. Les gains, eux, peuvent dépasser ce montant sans limite."],
  ["Prélèvements sociaux", "Taxe sur les gains (CSG, CRDS…) : 18,6 % depuis 2026. Sur un PEA de plus de 5 ans, c'est la seule taxe sur les gains."],
  ["Plus-value latente", "Le gain que tu as sur le papier tant que tu n'as pas vendu. Il n'est ni taxé ni définitif."],
  ["Volatilité", "L'ampleur des hausses et des baisses d'un placement. Le Nasdaq 100 est plus volatil que le MSCI Monde."],
  ["Krach", "Une chute brutale et forte des marchés, souvent de plus de 20 %. Il y en a eu en 2000, 2008, 2020 et 2022."],
  ["Capitalisation boursière", "Le prix de l'action multiplié par le nombre d'actions : la valeur totale d'une entreprise en bourse. Plus elle est grande, plus l'entreprise pèse dans un indice."],
  ["Frais courants", "Ce que l'ETF prélève chaque année pour fonctionner, déjà déduit de son cours. Pour tes ETF, ils sont faibles."],
  ["Réplication synthétique", "Pour être éligible au PEA, un ETF Monde achète des actions européennes et échange leur performance contre celle de l'indice (un « swap »). Tu reçois bien la performance de l'indice."],
  ["Banque centrale", "La Fed (États-Unis) et la BCE (zone euro) fixent les taux d'intérêt. Une baisse des taux aide en général les actions."],
  ["Inflation", "La hausse générale des prix. Si ton placement rapporte moins que l'inflation, ton pouvoir d'achat baisse."],
  ["Intérêts composés", "Tes gains produisent eux-mêmes des gains. C'est pour cela que la courbe de projection accélère avec le temps."]
];

let view = "jour";
let LATEST = null, DATA = null, current = "nasdaq", selected = null, dayList = [];
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
current = store.get("pea-tab") || "nasdaq";
view = ["jour", "pourquoi", "agenda", "pea", "analyse"].includes(store.get("pea-view")) ? store.get("pea-view") : "jour";

const EXEMPLE = {global: 7000, nasdaq: 2000, europe: 1000};
/* Transactions importées : uniquement dans ce navigateur (clé pea-tx), jamais en ligne. */
function txList() {
  try { const t = JSON.parse(store.get("pea-tx") || "[]"); return Array.isArray(t) ? t : []; } catch { return []; }
}
// Parts détenues et coût (prix de revient moyen) d'un ETF à une date donnée.
function txPos(id, jusqua) {
  let q = 0, cout = 0, realise = 0;
  txList().filter(t => t.etf === id && (!jusqua || t.d <= jusqua)).sort((a, b) => a.d.localeCompare(b.d)).forEach(t => {
    if (t.type === "achat") { q += t.q; cout += t.m + (t.f || 0); }
    else if (t.type === "vente" && q > 0) { const pru = cout / q, qv = Math.min(t.q, q); realise += t.m - (t.f || 0) - pru * qv; cout -= pru * qv; q -= qv; }
  });
  return {q, cout, pru: q ? cout / q : 0, realise};
}
const hasTx = () => txList().some(t => t.etf);
function invested(e) {
  if (hasTx() && e.eur && e.eur.close) return txPos(e.id, e.eur.date).q * e.eur.close;
  const s = parseFloat(store.get("pea-inv-" + e.id));
  return isFinite(s) && s >= 0 ? s : (EXEMPLE[e.id] ?? 1000);
}
const hasOwn = () => hasTx() || (LATEST || DATA).etfs.some(e => store.get("pea-inv-" + e.id) != null);

function colorFor(c) {
  if (c == null) return css("--flat");
  const t = Math.min(Math.abs(c) / 4, 1);
  const base = c >= 0 ? css("--up") : css("--down");
  return `color-mix(in srgb, ${base} ${Math.round(35 + t * 65)}%, ${css("--flat")})`;
}

/* Treemap « squarified » : chaque tuile a une surface proportionnelle au poids dans l'ETF. */
function squarify(items, x, y, w, h) {
  const out = [];
  const total = items.reduce((s, i) => s + i.w, 0);
  const scale = (w * h) / total;
  let rest = items.map(i => ({...i, a: i.w * scale}));
  while (rest.length) {
    const short = Math.min(w, h);
    let row = [rest[0]], best = worst(row, short), k = 1;
    while (k < rest.length) {
      const next = row.concat(rest[k]), wv = worst(next, short);
      if (wv > best) break;
      row = next; best = wv; k++;
    }
    const sum = row.reduce((s, r) => s + r.a, 0);
    if (w >= h) {
      const cw = sum / h; let cy = y;
      row.forEach(r => { const rh = r.a / cw; out.push({...r, x, y: cy, w: cw, h: rh}); cy += rh; });
      x += cw; w -= cw;
    } else {
      const ch = sum / w; let cx = x;
      row.forEach(r => { const rw = r.a / ch; out.push({...r, x: cx, y, w: rw, h: ch}); cx += rw; });
      y += ch; h -= ch;
    }
    rest = rest.slice(k);
  }
  return out;
  function worst(r, s) {
    const sum = r.reduce((a, b) => a + b.a, 0), mx = Math.max(...r.map(i => i.a)), mn = Math.min(...r.map(i => i.a));
    return Math.max((s * s * mx) / (sum * sum), (sum * sum) / (s * s * mn));
  }
}

function courbe(e) { return (e.eur && e.eur.history) || e.history; }

function lineChart(hist) {
  const W = 640, H = 170, P = {l: 8, r: 52, t: 14, b: 22};
  const vals = hist.map(h => h[1]);
  const base = vals[0];
  const pcts = vals.map(v => (v / base - 1) * 100);
  let mn = Math.min(...pcts, 0), mx = Math.max(...pcts, 0);
  const pad = (mx - mn) * 0.12 || 1; mn -= pad; mx += pad;
  const X = i => P.l + (i / (pcts.length - 1)) * (W - P.l - P.r);
  const Y = v => P.t + (1 - (v - mn) / (mx - mn)) * (H - P.t - P.b);
  const pts = pcts.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  const last = pcts[pcts.length - 1];
  const col = last >= 0 ? "var(--up)" : "var(--down)";
  const months = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
  const lab = d => { const [, m, j] = d.split("-"); return `${+j} ${months[+m - 1]}`; };
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution sur ${hist.length} séances : ${fmtPct(last, 1)}">
    <line x1="${P.l}" x2="${W - P.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)" stroke-dasharray="4 4"/>
    <text x="${W - P.r + 6}" y="${Y(0) + 4}" font-size="11" fill="var(--muted)" font-family="var(--f-num)">0 %</text>
    <polygon points="${X(0)},${Y(0)} ${pts} ${X(pcts.length - 1)},${Y(0)}" fill="${col}" opacity=".12"/>
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(pcts.length - 1)}" cy="${Y(last)}" r="4.5" fill="${col}"/>
    <text x="${W - P.r + 6}" y="${Y(last) + 4}" font-size="12" font-weight="700" fill="${col}" font-family="var(--f-num)">${fmtPct(last, 1)}</text>
    <text x="${P.l}" y="${H - 5}" font-size="11" fill="var(--muted)">${lab(hist[0][0])}</text>
    <text x="${W - P.r}" y="${H - 5}" font-size="11" fill="var(--muted)" text-anchor="end">${lab(hist[hist.length - 1][0])}</text>
  </svg>`;
}

function newsFor(sym) { return (DATA.news || []).filter(n => (n.tickers || []).includes(sym)); }

function lexiqueHtml() {
  const jour = WORDS[(new Date(DATA.date).getDate() + new Date(DATA.date).getMonth() * 31) % WORDS.length][0];
  const liste = WORDS.slice().sort((a, b) => a[0].localeCompare(b[0], "fr"));
  return `<section class="card">
    <h2>Lexique</h2>
    <input id="lex-q" class="search" type="search" placeholder="Chercher un mot (ex. dividende)" aria-label="Chercher dans le lexique">
    <dl class="lex">${liste.map(([m, d]) => `<div class="lexitem${m === jour ? " today" : ""}" data-t="${esc((m + " " + d).toLowerCase())}"><dt>${esc(m)}${m === jour ? ` <span class="chip">mot du jour</span>` : ""}</dt><dd>${esc(d)}</dd></div>`).join("")}</dl>
    <p class="muted small" id="lex-vide" hidden>Aucun mot trouvé.</p>
  </section>`;
}

function headerHtml(title, eyebrow) {
  return `<header>
    <span class="eyebrow">${esc(eyebrow)}</span>
    <h1>${esc(title)}</h1>
  </header>`;
}
const VUES = [["jour", "Séance", "M3 17l5-5 4 4 8-8M14 8h6v6"], ["pourquoi", "Pourquoi", "M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 13v.01M12 7.5c1.6 0 2.8 1 2.8 2.4 0 1.9-2.8 2-2.8 3.9"], ["agenda", "Agenda", "M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"], ["pea", "Mon PEA", "M3 10l9-6 9 6v10H3zM9 20v-6h6v6"], ["analyse", "Analyse", "M12 3v9h9A9 9 0 1 1 12 3zM15 3.5A9 9 0 0 1 20.5 9H15z"]];
function navHtml() {
  return `<nav class="bottomnav" aria-label="Pages">${VUES.map(([id, nom, d]) => `<button class="navbtn" data-view="${id}" aria-current="${view === id ? "page" : "false"}"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="${d}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>${nom}</span></button>`).join("")}</nav>`;
}
let SUB = {};
try { SUB = JSON.parse(localStorage.getItem("pea-sub") || "{}") || {}; } catch {}
const SUBS = {
  pourquoi: [["explications", "Explications"], ["classement", "Qui a pesé"], ["lexique", "Lexique"]],
  agenda: [["calendrier", "Calendrier"], ["recap", "Récap semaine"]],
  pea: [["chiffres", "Chiffres"], ["achats", "Achats"], ["projection", "Projection"], ["objectif", "Objectif"], ["comparer", "Comparer"], ["fiscalite", "Impôts"]],
  analyse: [["doublons", "Doublons"], ["repartition", "Répartition"], ["krach", "Si ça chute"]]
};
function sub() {
  const l = SUBS[view] || [];
  return l.some(x => x[0] === SUB[view]) ? SUB[view] : (l[0] || [])[0];
}
function subNav() {
  const l = SUBS[view]; if (!l) return "";
  return `<div class="subnav" role="group" aria-label="Sous-pages">${l.map(([id, nom]) => `<button class="subbtn" data-sub="${id}" aria-pressed="${sub() === id}">${nom}</button>`).join("")}</div>`;
}
function wireViews() {
  const q = document.getElementById("lex-q");
  if (q) q.oninput = () => {
    const t = q.value.trim().toLowerCase(); let n = 0;
    document.querySelectorAll(".lexitem").forEach(it => { const ok = !t || it.dataset.t.includes(t); it.hidden = !ok; n += ok; });
    document.getElementById("lex-vide").hidden = n > 0;
  };
  document.querySelectorAll(".subbtn").forEach(b => b.onclick = () => { SUB[view] = b.dataset.sub; store.set("pea-sub", JSON.stringify(SUB)); render(); scrollTo(0, 0); });
  document.querySelectorAll(".navbtn").forEach(b => b.onclick = () => { view = b.dataset.view; store.set("pea-view", view); render(); scrollTo(0, 0); });
}

function render() {
  if ((view === "pea" || view === "analyse") && typeof renderPea === "function") return renderPea();
  const app = document.getElementById("app");
  const etfs = DATA.etfs;
  if (!etfs.find(e => e.id === current)) current = etfs[0].id;
  const e = etfs.find(x => x.id === current);
  const totalImpact = etfs.reduce((s, x) => s + invested(x) * (x.day || 0) / 100, 0);
  const totalInv = etfs.reduce((s, x) => s + invested(x), 0);
  const inv = invested(e);
  const hold = e.holdings.slice().sort((a, b) => b.w - a.w);
  const covered = hold.reduce((s, h) => s + h.w, 0);
  const contrib = hold.filter(h => h.c != null).map(h => ({...h, ct: h.w * h.c / 100, eur: inv * h.w / 100 * h.c / 100})).sort((a, b) => b.ct - a.ct);
  const maxCt = Math.max(...contrib.map(c => Math.abs(c.ct)), 0.01);
  const ups = contrib.filter(c => c.c > 0).length, downs = contrib.filter(c => c.c < 0).length;
  const winner = contrib[0], loser = contrib[contrib.length - 1];
  const newsHere = (DATA.news || []).filter(n => !n.etfs || n.etfs.includes(e.id));
  const word = WORDS[(new Date(DATA.date).getDate() + new Date(DATA.date).getMonth() * 31) % WORDS.length];
  const sel = selected && hold.find(h => h.s === selected);

  const days = dayList.length > 1 ? `<div class="days" role="group" aria-label="Choisir une séance">${dayList.map(d => `<button class="day" data-day="${esc(d.id)}" aria-pressed="${d.id === DATA.date}">${esc(d.short)}</button>`).join("")}</div>` : "";
  const tabs = `
  <nav class="tabs" role="tablist">
    ${etfs.map(x => `<button class="tab" role="tab" data-tab="${x.id}" aria-selected="${x.id === current}">
      <span>${esc(x.short)}</span><span class="num ${x.id === current ? "" : cls(x.day)}">${fmtPct(x.day)}</span></button>`).join("")}
  </nav>`;
  const titres = {jour: "Ce qui a fait bouger mon argent", pourquoi: "Pourquoi ça a bougé", agenda: "Ce qui arrive"};
  let page;
  if (view === "pourquoi") page = `${days}
${subNav()}
${sub() === "lexique" ? lexiqueHtml() : `${tabs}

${sub() === "classement" ? `  <section class="card">
    <h2>Qui a tiré l'ETF vers le haut ou le bas</h2>
    <p class="muted small" style="margin:4px 0 0">${winner && winner.ct > 0 ? `<b class="up">${esc(winner.n)}</b> a le plus aidé, ` : ""}${loser && loser.ct < 0 ? `<b class="down">${esc(loser.n)}</b> a le plus pesé.` : ""} Chiffre de droite : effet en euros sur ton argent.</p>
    <div class="bars">${contrib.map(c => {
      const wPct = Math.abs(c.ct) / maxCt * 50;
      const left = c.ct >= 0 ? 50 : 50 - wPct;
      return `<button class="bar" data-sym="${esc(c.s)}" aria-label="${esc(c.n)} ${fmtPct(c.c)}, ${fmtEur(c.eur)}">
        <span class="name">${esc(c.n)}</span>
        <span class="track"><span class="fill" style="left:${left}%;width:${Math.max(wPct, .6)}%;background:${c.ct >= 0 ? "var(--up)" : "var(--down)"}"></span></span>
        <span class="num ${cls(c.c)}">${fmtEur(c.eur)}</span></button>`;
    }).join("")}</div>
  </section>` : `<section class="card">
    <h2>Les explications du jour</h2>
    <div class="news" style="margin-top:10px">
      ${newsHere.length ? newsHere.map(n => `<article class="newsitem ${n.sens === "up" ? "up" : n.sens === "down" ? "down" : ""}">
        <h3>${esc(n.titre)}</h3><p>${esc(n.texte)}</p>
        <div class="chips">${(n.tickers || []).map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div>
        <span class="muted small">Source : ${esc(n.source)}</span></article>`).join("") : `<p class="muted">Pas d'annonce marquante pour cet ETF ce jour-là.</p>`}
    </div>
  </section>

  <section class="card word">
    <span class="eyebrow">Le mot du jour</span>
    <h3>${esc(word[0])}</h3><p>${esc(word[1])}</p>
  </section>`}`}`;
  else if (view === "agenda") page = `${subNav()}${typeof recapHtml === "function" ? (sub() === "recap" ? recapHtml() : calendrierHtml()) : ""}`;
  else page = `${days}

  <section class="card">
    <div class="hero">
      <div>
        <div class="eyebrow">${hasOwn() ? "Mon PEA ce jour-là (estimation)" : "Exemple : 10 000 € en 70/20/10"}</div>
        <div class="big num ${cls(totalImpact)}">${fmtEur(totalImpact)}</div>
      </div>
      <span class="pill ${cls(totalImpact)} num">${fmtPct(totalInv ? totalImpact / totalInv * 100 : 0)}</span>
    </div>
    <p class="resume" style="margin-top:12px">${esc(DATA.resume)}</p>
    ${hasOwn() ? "" : `<p class="muted small" style="margin:8px 0 0">Entre tes montants dans l'onglet « Mon PEA » : ils restent uniquement sur ton appareil.</p>`}
  </section>

${tabs}

  <section class="card">
    <div class="etfhead">
      <div><h2>${esc(e.name)}</h2><div class="muted small">${esc(e.total)} · 30 dernières séances</div></div>
      <span class="pill ${cls(e.day)} num">${fmtPct(e.day)} ce jour-là</span>
    </div>
    ${lineChart(courbe(e))}
    <div class="kpis">
      <div class="kpi"><label for="inv-${e.id}">Mon argent dedans</label><input id="inv-${e.id}" class="num" inputmode="decimal" ${hasTx() ? "readonly" : ""} value="${inv.toFixed(2).replace(".", ",")}" aria-label="Montant investi dans ${esc(e.name)} en euros"></div>
      <div class="kpi"><label>Effet du jour</label><div class="v num ${cls(e.day)}">${fmtEur(inv * e.day / 100)}</div></div>
      <div class="kpi"><label>Hausse / baisse</label><div class="v num"><span class="up">${ups}↑</span> <span class="down">${downs}↓</span></div></div>
    </div>
  </section>

  <section class="card">
    <h2>La carte des entreprises</h2>
    <p class="muted small" style="margin:4px 0 0">Plus la case est grande, plus l'entreprise pèse dans l'ETF. Vert = hausse, rouge = baisse. Touche une case pour le détail.</p>
    <div class="treemap" id="tm"></div>
    <div class="legend"><span>−4 %</span><i style="background:${colorFor(-4)}"></i><i style="background:${colorFor(-1.5)}"></i><i style="background:${colorFor(0)}"></i><i style="background:${colorFor(1.5)}"></i><i style="background:${colorFor(4)}"></i><span>+4 %</span><span>· gris = cours non disponible</span></div>
    ${sel ? detailHtml(sel, inv) : `<p class="muted small" style="margin:10px 0 0">Ces ${hold.length} entreprises représentent ${covered.toFixed(0)} % de l'ETF.</p>`}
  </section>

  <footer class="foot">
    <details><summary>D'où viennent les chiffres ?</summary>
      <p>Cours de clôture du ${esc(DATA.label)}. ${esc(e.proxyNote)} Les cours en euros viennent de LS Exchange, comme dans Trade Republic (dernier cours à 23 h). Le week-end, Trade Republic peut afficher un prix un peu différent, car LS cote aussi le samedi et le dimanche. Compositions au ${esc(e.holdingsDate.split("-").reverse().join("/"))}, seules les plus grosses positions sont affichées. Les montants « Mon argent dedans » sont enregistrés uniquement dans ton navigateur, jamais en ligne.</p>
    </details>
    <span>Mis à jour chaque soir de semaine après la clôture américaine. Dernière mise à jour : ${new Date(DATA.updatedAt).toLocaleString("fr-FR", {dateStyle: "medium", timeStyle: "short"})}.</span>
  </footer>`;
  app.innerHTML = `${headerHtml(titres[view] || titres.jour, "Mon PEA · séance du " + DATA.label)}
${page}
${navHtml()}`;

  if (document.getElementById("tm")) drawTreemap(hold);
  wire(e);
}

function detailHtml(h, inv) {
  const ns = newsFor(h.s);
  const eur = h.c == null ? null : inv * h.w / 100 * h.c / 100;
  const fiche = typeof COMPO !== "undefined" && COMPO?.fiches?.[h.s];
  const base = h.n.replace(/ [AC]$/, "");
  const presence = (LATEST || DATA).etfs.map(e => {
    const w = e.holdings.filter(x => x.n.replace(/ [AC]$/, "") === base).reduce((a, x) => a + x.w, 0);
    return w ? {etf: e.short, w, eur: invested(e) * w / 100} : null;
  }).filter(Boolean);
  return `<div class="detail" aria-live="polite">
    <span class="eyebrow">Fiche entreprise</span>
    <div class="row"><h3>${esc(h.n)}</h3><span class="chip">${esc(h.s)}</span><span class="pill ${cls(h.c)} num">${fmtPct(h.c)}</span></div>
    ${fiche ? `<p style="margin:0">${esc(fiche.d)}</p>` : ""}
    <div class="row small"><span>${esc(h.sec)} · ${esc(h.pays)}</span>
    ${fiche && fiche.an != null ? `<span>Sur 1 an : <b class="num ${cls(fiche.an)}">${fmtPct(fiche.an, 0)}</b></span>` : ""}
    ${eur != null ? `<span>Effet du jour : <b class="num ${cls(h.c)}">${fmtEur(eur)}</b></span>` : ""}</div>
    <div class="fichegrid">${presence.map(p => `<div><span class="muted small">${esc(p.etf)}</span><b class="num">${p.w.toFixed(2).replace(".", ",")} %</b><span class="num small">${fmtEurPlain(p.eur)}</span></div>`).join("")}
      <div class="tot"><span class="muted small">Total chez toi</span><b class="num">${fmtEurPlain(presence.reduce((a, p) => a + p.eur, 0))}</b><span class="small">${presence.length > 1 ? "dans " + presence.length + " ETF" : "dans 1 ETF"}</span></div></div>
    ${ns.length ? ns.map(n => `<p style="margin:0"><b>${esc(n.titre)}.</b> ${esc(n.texte)}</p>`).join("") : `<p class="muted small" style="margin:0">Pas d'annonce particulière trouvée : mouvement en ligne avec le marché.</p>`}
  </div>`;
}

function drawTreemap(hold) {
  const tm = document.getElementById("tm");
  const W = tm.clientWidth, H = tm.clientHeight;
  if (!W || !H) return;
  const rects = squarify(hold, 0, 0, W, H);
  tm.innerHTML = rects.map(r => {
    const size = r.w < 46 || r.h < 34 ? "xs" : r.w < 80 || r.h < 50 ? "sm" : "";
    return `<div class="tile ${size}" tabindex="0" role="button" data-sym="${esc(r.s)}" aria-label="${esc(r.n)} ${fmtPct(r.c)}"
      style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;background:${colorFor(r.c)};${selected === r.s ? "outline:3px solid var(--ink);outline-offset:-3px;" : ""}">
      <b>${esc(r.n)}</b><span class="num">${fmtPct(r.c, 1)}</span></div>`;
  }).join("");
}

function wire(e) {
  wireViews();
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { current = b.dataset.tab; selected = null; store.set("pea-tab", current); render(); });
  document.querySelectorAll("[data-sym]").forEach(t => {
    const pick = () => { selected = selected === t.dataset.sym ? null : t.dataset.sym; if (view !== "jour" && selected) { view = "jour"; store.set("pea-view", view); } render(); document.getElementById("tm")?.scrollIntoView({block: "nearest", behavior: "smooth"}); };
    t.onclick = pick;
    t.onkeydown = ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); pick(); } };
  });
  document.querySelectorAll(".day").forEach(b => b.onclick = () => loadDay(b.dataset.day));
  const inp = document.getElementById("inv-" + e.id);
  if (inp) inp.onchange = () => {
    const v = parseFloat(inp.value.replace(/\s/g, "").replace(",", "."));
    if (isFinite(v) && v >= 0) store.set("pea-inv-" + e.id, String(v));
    render();
  };
}

let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => DATA && render(), 150); });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => DATA && render());
new MutationObserver(() => DATA && render()).observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme"]});

function showMessage(title, text) {
  const l = document.getElementById("loading");
  if (l) l.innerHTML = `<h3>${esc(title)}</h3><p class="muted small">${esc(text)}</p>`;
}

async function loadDay(id) {
  try {
    if (id === LATEST.date) { DATA = LATEST; selected = null; render(); return; }
    const r = await fetch("jours/" + id + ".json", {cache: "no-cache"});
    if (!r.ok) return;
    const d = await r.json();
    d.etfs.forEach(e => {
      const l = LATEST.etfs.find(x => x.id === e.id);
      if (!e.history && l) e.history = l.history.filter(h => h[0] <= d.date);
      if (l && l.eur && !(e.eur && e.eur.history)) e.eur = Object.assign({}, l.eur, e.eur || {}, {history: l.eur.history.filter(h => h[0] <= d.date)});
    });
    DATA = d; selected = null; render();
  } catch {}
}

(async () => {
  try {
    const r = await fetch("data.json", {cache: "no-cache"});
    if (!r.ok) throw new Error(r.status);
    LATEST = DATA = await r.json();
    render();
    const q = await fetch("jours/index.json", {cache: "no-cache"});
    if (q.ok) {
      const jours = ["dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."];
      dayList = (await q.json()).sort().reverse().slice(0, 10).map(id => { const dt = new Date(id + "T12:00:00"); return {id, short: `${jours[dt.getDay()]} ${dt.getDate()}/${dt.getMonth() + 1}`}; });
      if (dayList.length > 1) render();
    }
  } catch (err) {
    showMessage("Chargement impossible", "Les données n'ont pas pu être lues. Recharge la page dans un instant.");
  }
})();
["gesturestart", "gesturechange"].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive: false}));
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
